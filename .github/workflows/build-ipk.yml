name: Build luci-app-mtk-easymesh ipk (SDK)

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "ImmortalWrt SDK 版本 (iloop: 24.10.1/24.10.4)"
        required: false
        default: "24.10.4"
        type: string
      build_version:
        description: "包版本号 (写入 About 栏)"
        required: false
        default: "0.2.1beta"
        type: string
      upload_release:
        description: "是否上传到 GitHub Release"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

concurrency:
  group: build-ipk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 1

      # build_version 会拼进 git tag / Release 名, 直接使用用户输入时,
      # 含空格或非法字符(如 "0.4.0 test")会让 Release 步骤失败。
      # 这里消毒成合法 ref/tag 字符集 [A-Za-z0-9._-], 非法字符统一替换为 "-"。
      - name: Sanitize build version
        id: version
        run: |
          RAW="${{ github.event.inputs.build_version }}"
          CLEAN="$(printf '%s' "$RAW" | sed -e 's/[[:space:]]*$//' -e 's/^[[:space:]]*//' -e 's/[^A-Za-z0-9._-]/-/g')"
          CLEAN="${CLEAN:-0.2.1beta}"
          echo "raw build_version  : $RAW"
          echo "clean build_version: $CLEAN"
          echo "build_version=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib zstd libzstd-dev \
            binutils bzip2 cpio curl file flex bison gawk gettext git \
            libncurses-dev libssl-dev libtool libxml-parser-perl make \
            python3 python3-setuptools python3-pyelftools python3-pip \
            qemu-utils rsync scons subversion swig time unzip wget xsltproc

      # ===== ImmortalWrt SDK: 工具链已预编译, 单编 luci JS 包只需几分钟 =====
      # SDK release 固定版本内容不变, 缓存解压后的 SDK, 二次触发免去重新下载 1GB+ 文件
      - name: Cache SDK (解压后)
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: sdk-${{ github.event.inputs.sdk_version }}
          restore-keys: |
            sdk-${{ github.event.inputs.sdk_version }}

      - name: Download & extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          VER="${{ github.event.inputs.sdk_version }}"
          URL="https://mirrors.vsean.net/immortalwrt/releases/$VER/targets/mediatek/filogic/immortalwrt-sdk-$VER-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          echo "SDK_URL=$URL"
          wget -q -O sdk.tar.zst "$URL"
          mkdir -p sdk
          tar -C sdk --strip-components=1 -xaf sdk.tar.zst
          ls sdk | head

      # luci feed 内容基本不变, 缓存后免重复 git clone
      - name: Cache luci feed
        id: cache-feeds
        uses: actions/cache@v4
        with:
          path: sdk/feeds
          key: feeds-${{ github.event.inputs.sdk_version }}
          restore-keys: |
            feeds-${{ github.event.inputs.sdk_version }}

      - name: Update luci feed (提供 luci.mk / luci-base)
        working-directory: sdk
        run: |
          ls feeds/luci/luci.mk >/dev/null 2>&1 || ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy app into SDK
        run: |
          # 缓存的 sdk/ 里带有上次复制的旧包, 必须先删掉, 否则 cp -R 会嵌套成 .../app/
          rm -rf sdk/package/luci-app-mtk-easymesh
          cp -R "$GITHUB_WORKSPACE/app" sdk/package/luci-app-mtk-easymesh
          rm -rf sdk/package/luci-app-mtk-easymesh/.git
          test -f sdk/package/luci-app-mtk-easymesh/Makefile
          test -f sdk/package/luci-app-mtk-easymesh/htdocs/luci-static/resources/view/easymesh/about.js

      - name: Stamp package version into About view
        working-directory: sdk/package/luci-app-mtk-easymesh
        run: |
          sed -i "s/var PKG_VERSION = '.*';/var PKG_VERSION = '${{ steps.version.outputs.build_version }}';/" \
            htdocs/luci-static/resources/view/easymesh/about.js
          grep -n "PKG_VERSION =" htdocs/luci-static/resources/view/easymesh/about.js

      - name: Slim DEPENDS for SDK build (mtwifi-cfg/wapp 是目标固件私有, SDK 无此定义)
        working-directory: sdk/package/luci-app-mtk-easymesh
        run: |
          sed -i 's/LUCI_DEPENDS:=+mtwifi-cfg +mtwifi-wapp +lua-cjson/LUCI_DEPENDS:=+lua-cjson/' Makefile
          sed -i 's#https://github.com/yyyyy114514#https://github.com/openwrt#g' Makefile || true
          grep LUCI_DEPENDS Makefile

      - name: Enable app and build ipk
        working-directory: sdk
        run: |
          # 清掉缓存 sdk 里上次编译的旧 ipk, 避免把过期产物发到 artifact / release
          rm -f sdk/bin/packages/*/luci-app-mtk-easymesh*.ipk
          rm -f sdk/ipk.log
          # SDK 默认带全套 packages; 显式启用本包(依赖 lua-cjson 在 packages feed 中)
          echo "CONFIG_PACKAGE_luci-app-mtk-easymesh=y" >> .config
          make defconfig
          grep -nE "luci-app-mtk-easymesh|lua-cjson" .config | head
          make package/luci-app-mtk-easymesh/compile -j$(nproc) V=s > ipk.log 2>&1 \
            || { echo "=== COMPILE FAILED (tail 200) ==="; tail -200 ipk.log; echo "--- grep errors ---"; grep -iE "error|No such file|cannot" ipk.log | tail -40; exit 1; }
          echo "=== ipk files ==="
          find bin/packages -name 'luci-app-mtk-easymesh_*.ipk' -exec ls -l {} \;

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: luci-app-mtk-easymesh-ipk
          path: |
            sdk/bin/packages/**/luci-app-mtk-easymesh_*.ipk
            sdk/ipk.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ipk to GitHub Release
        if: ${{ !cancelled() && github.event.inputs.upload_release == 'yes' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luci-app-mtk-easymesh-${{ steps.version.outputs.build_version }}
          name: luci-app-mtk-easymesh ${{ steps.version.outputs.build_version }}
          body: |
            ## luci-app-mtk-easymesh — MTK EasyMesh (MAP / wapp) 面板

            - 版本: ${{ steps.version.outputs.build_version }}
            - SDK: ImmortalWrt ${{ github.event.inputs.sdk_version }} (mediatek/filogic)
            - 依赖: mtwifi-cfg mtwifi-wapp lua-cjson（需编译mt789x mtwifi闭源固件时添加）

            安装:
            ```
            opkg install luci-app-mtk-easymesh_*.ipk
            ```
          files: |
            sdk/bin/packages/**/luci-app-mtk-easymesh_*.ipk
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
